<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bibliany - Pesquise livros digitais e audiolivros em bibliotecas públicas digitais</title>
<meta name="description" content="Pesquise livros digitais e audiolivros em bibliotecas públicas">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f3f6f5;
  --card: #ffffff;
  --text: #16241f;
  --muted: #566a64;
  --border: #d3dedb;
  --hero: #0f4c45;
  --hero-text: #ffffff;
  --hero-muted: #b4dcd5;
  --accent: #ff9a47;
  --accent-text: #16241f;
  --chip-on: #0f4c45;
  --chip-on-text: #ffffff;
  --focus: #0b8f7f;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101816;
    --card: #19241f;
    --text: #eef5f2;
    --muted: #9db3ab;
    --border: #31453e;
    --hero: #07211d;
    --chip-on: #ff9a47;
    --chip-on-text: #16241f;
    --focus: #5fd6c4;
  }
}

html { height: 100%; }

body {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  font-family: var(--font);
  line-height: 1.55;
  background: var(--bg);
  color: var(--text);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Hero */
header {
  background: var(--hero);
  color: var(--hero-text);
  padding: clamp(32px, 7vw, 72px) 20px clamp(72px, 12vw, 120px);
}

.hero-inner {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: clamp(16px, 4vw, 32px);
}

header img {
  width: clamp(72px, 14vw, 112px);
  height: clamp(72px, 14vw, 112px);
  border-radius: 20px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.08);
}

header h1 {
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
}

header p {
  margin-top: 8px;
  font-size: clamp(1rem, 2.4vw, 1.15rem);
  color: var(--hero-muted);
  max-width: 34ch;
}

/* Search card overlapping hero */
main {
  flex: 1;
  padding: 0 20px 40px;
}

.search-card {
  max-width: 760px;
  margin: -56px auto 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(20px, 4vw, 32px);
  box-shadow: 0 18px 40px -16px rgba(5, 40, 35, 0.35);
}

.field-label {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-bottom: 26px;
}

input[type="search"] {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 1.1rem;
  padding: 14px 16px;
  color: var(--text);
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
}

input[type="search"]::placeholder { color: var(--muted); }
input[type="search"]:focus { outline: none; border-color: var(--focus); }

.btn {
  font: inherit;
  font-weight: 600;
  font-size: 1.05rem;
  border-radius: 12px;
  cursor: pointer;
  padding: 14px 24px;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
  border: 2px solid var(--accent);
}

.btn-primary:hover { filter: brightness(0.95); }
.btn-primary:active { transform: translateY(1px); }

/* Site chips */
fieldset { border: 0; min-width: 0; }

legend {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 10px;
  padding: 0;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.chip span {
  display: inline-block;
  padding: 9px 16px;
  font-size: 0.95rem;
  border: 2px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}

.chip span:hover { border-color: var(--muted); }

.chip input:checked + span {
  background: var(--chip-on);
  border-color: var(--chip-on);
  color: var(--chip-on-text);
  font-weight: 600;
}

.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.card-footer {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 0.9rem;
  color: var(--muted);
}

.btn-ghost {
  font: inherit;
  font-size: 0.9rem;
  background: none;
  border: none;
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 4px;
}

.btn-ghost:hover { color: var(--text); }

/* Footer */
.rodape {
  display: flex;
  justify-content: center;
  padding: 20px;
  font-size: 0.9rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
}

.rodape a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}

.rodape a:hover { text-decoration: underline; }
.rodape svg { width: 18px; height: 18px; flex-shrink: 0; }

@media (max-width: 520px) {
  .hero-inner { flex-direction: column; align-items: flex-start; }
  .search-row { flex-direction: column; }
  .btn-primary { width: 100%; }
  .card-footer { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header>
  <div class="hero-inner">
    <img src="logo.png" alt="Logo Bibliany">
    <div>
      <h1>Bibliany</h1>
      <p>Pesquise livros digitais e audiolivros em bibliotecas públicas</p>
    </div>
  </div>
</header>

<main>
  <div class="search-card">
    <form name="searchform" onsubmit="return dosearch();">
      <label class="field-label" for="searchterms">Título ou autor</label>
      <div class="search-row">
        <input type="search" id="searchterms" name="searchterms" placeholder="Ex.: Dom Casmurro, Machado de Assis" autofocus autocomplete="off">
        <button type="submit" class="btn btn-primary">Buscar</button>
      </div>

      <fieldset>
        <legend>Biblioteca</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="sites" value="https://meclivros.mec.gov.br/search?search=" checked><span>MEC Livros</span></label>
          <label class="chip"><input type="radio" name="sites" value="https://livros.arvore.com.br/biblioteca/busca/"><span>BibliON</span></label>
          <label class="chip"><input type="radio" name="sites" value="https://www2.senado.leg.br/bdsf/discover?scope=%2F&submit=Ir&filtertype_0=type&filter_relational_operator_0=notequals&filter_0=Artigo+de+jornal&query="><span>Biblioteca do Senado</span></label>
          <label class="chip"><input type="radio" name="sites" value="https://funag.gov.br/biblioteca-nova/todos/0?filtro=1&ord=1&busca="><span>Biblioteca da FUNAG</span></label>
          <label class="chip"><input type="radio" name="sites" value="https://bdor.sibi.ufrj.br/simple-search?query="><span>Biblioteca UFRJ</span></label>
        </div>
      </fieldset>

      <div class="card-footer">
        <span>A busca abre em uma nova aba.</span>
        <button type="reset" class="btn-ghost">Limpar busca</button>
      </div>
    </form>
  </div>
</main>

<div class="rodape">
  <a href="https://github.com/andguerreiro/bibliany" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    Código aberto no GitHub
  </a>
</div>

<script>
  function dosearch() {
    var sf = document.searchform;
    var site = sf.querySelector('input[name="sites"]:checked').value;
    window.open(site + encodeURIComponent(sf.searchterms.value.trim()), '_blank');
    return false;
  }
</script>
</body>
</html>
